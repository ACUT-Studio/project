name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore acut.slnx

      - name: Build solution
        run: dotnet build acut.slnx --no-restore --configuration Release

      - name: Run unit and UI tests
        run: >
          dotnet test acut.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Check code formatting (Quality Gate)
        run: dotnet format acut.slnx --verify-no-changes --no-restore
        continue-on-error: true # приберіть цей рядок після приведення коду до єдиного стилю

      - name: Check vulnerable NuGet packages
        run: dotnet list acut.slnx package --vulnerable --include-transitive

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: ./TestResults